[package]
name = "nusaharvest-siaga-svm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Separate package so litesvm's pinned solana-* versions never touch the on-chain crate.
[dev-dependencies]
litesvm = "0.16"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-instruction = "3.4"
solana-account = "4.3"
solana-clock = "3.1"
solana-address = "2.6"
sha2 = "0.10"

