[package]
name = "nusaharvest-siaga"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NusaHarvest Siaga Tanam: rainfall-triggered parametric payout program, pure Pinocchio"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []

[dependencies]
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi", "copy", "sha2"] }
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"

[target.'cfg(any(target_os = "solana", target_arch = "bpf"))'.dependencies]
solana-sha256-hasher = { version = "3.1.0", default-features = false }

[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-sha256-hasher = { version = "3.1.0", default-features = false, features = ["sha2"] }
solana-address = { version = "2.7", default-features = false, features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[workspace]
