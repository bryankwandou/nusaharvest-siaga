[workspace]
resolver = "2"
members = ["crates/kit"]
exclude = ["fuzz", "probe"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi", "copy", "sha2", "account-resize"] }
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
pinocchio-log = { version = "0.5.1", default-features = false, features = ["macro"] }
solana-address = { version = "2.7", default-features = false }
sha2-const-stable = "0.1"
borsh = { version = "1", default-features = false, features = ["derive"] }
shank = "0.4"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
